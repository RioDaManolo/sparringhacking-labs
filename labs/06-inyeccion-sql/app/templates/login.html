{% extends "base.html" %}
{% block titulo %}Ingresar &middot; Instituto TecnoSur{% endblock %}
{% block nav %}
<a class="enlace-nav" href="{{ url_for('buscar') }}">Volver al catálogo</a>
{% endblock %}
{% block contenido %}
<div class="tarjeta">
  <h1>Acceso coordinadores</h1>
  <p class="subtitulo">Catálogo de Cursos</p>

  {% if error %}
  <div class="aviso-error">{{ error }}</div>
  {% endif %}

  <form method="post" action="{{ url_for('login') }}">
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" name="usuario" autocomplete="off" required>

    <label for="clave">Contraseña</label>
    <input type="password" id="clave" name="clave" required>

    <button type="submit">Ingresar</button>
  </form>
</div>
{% endblock %}
